openapi: 3.1.0
info:
  description: Opens and retrieves savings bank accounts. Errors are returned as RFC
    9457 problem details.
  title: Savings Account API
  version: v1
servers:
- description: Local development
  url: http://localhost:8080
tags:
- description: Savings bank accounts
  name: Accounts
paths:
  /api/v1/accounts:
    post:
      description: Id and account number are generated by the API. A customer may
        hold at most 5 accounts.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Account created
          headers:
            Location:
              description: URL of the new account
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Validation failed; per-field messages are listed under `errors`
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Customer already holds the maximum number of accounts
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Database unavailable; retry after the `Retry-After` delay
      summary: Open a savings account
      tags:
      - Accounts
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      parameters:
      - description: Account id
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: Account found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Id is not a valid UUID
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Account not found
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Account not cached and database unavailable; retry after the
            `Retry-After` delay
      summary: Get a savings account
      tags:
      - Accounts
components:
  schemas:
    AccountResponse:
      type: object
      description: A savings account
      properties:
        accountNickname:
          type: string
          description: Absent when no nickname was given
          example: Holiday Fund
        accountNumber:
          type: string
          description: Generated 10-digit account number
          example: "1000000000"
        createdAt:
          type: string
          format: date-time
          description: When the account was opened (UTC)
        customerName:
          type: string
          example: Jane Citizen
        id:
          type: string
          format: uuid
          description: Generated account id
      required:
      - accountNumber
      - createdAt
      - customerName
      - id
    CreateAccountRequest:
      type: object
      description: Request to open a savings account
      properties:
        accountNickname:
          type: string
          description: "Optional nickname; trimmed, blank means none, must not be\
            \ offensive"
          example: Holiday Fund
          maxLength: 30
          minLength: 5
        customerName:
          type: string
          description: "Customer's full name; trimmed, compared case-insensitively\
            \ for the account limit"
          example: Jane Citizen
          maxLength: 100
          minLength: 0
          pattern: "^\\p{L}[\\p{L} .'-]*$"
      required:
      - customerName
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation messages per request field (validation failures
            only)
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri

spring.application.name=techassesment.westpac

# Postgres. Defaults match compose.yaml for local development.
# TODO: source credentials from a secrets manager rather than environment defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:accounts}
spring.datasource.password=${DB_PASSWORD:accounts}
# Fail fast (milliseconds) when the database is unreachable so clients get a 503 promptly.
spring.datasource.hikari.connection-timeout=2000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Redis cache for GET calls. Short timeouts because a cache failure falls back to the database.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

accounts.max-per-customer=5
accounts.cache-ttl=10m
accounts.nickname-moderation.word-list-location=classpath:moderation/offensive-nicknames.txt

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI: spec at /v3/api-docs(.yaml), UI at /swagger-ui.html. Sorted keys keep the exported spec diff-friendly.
springdoc.writer-with-order-by-keys=true
